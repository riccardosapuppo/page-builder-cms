# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
#
# The tests' own cache database is the one the page cache's tests write
# to through Solid Cache (test/support/page_cache_store.rb); every other
# test keeps the :null_store of config/environments/test.rb.
test:
  primary:
    <<: *default
    database: storage/test.sqlite3
  cache:
    <<: *default
    database: storage/test_cache.sqlite3
    migrations_paths: db/cache_migrate

# The CMS the editor's browser tests start (config/environments/e2e.rb).
# The harness gives each run a folder of its own through DATABASE_URL,
# CACHE_DATABASE_URL and QUEUE_DATABASE_URL, and deletes it afterwards;
# these paths are the defaults, for a run by hand.
e2e:
  primary:
    <<: *default
    database: tmp/e2e/e2e.sqlite3
  cache:
    <<: *default
    database: tmp/e2e/e2e_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: tmp/e2e/e2e_queue.sqlite3
    migrations_paths: db/queue_migrate

# SQLite3 write its data on the local filesystem, as such it requires
# persistent disks. If you are deploying to a managed service, you should
# make sure it provides disk persistence, as many don't.
#
# Similarly, if you deploy your application as a Docker container, you must
# ensure the database is located in a persisted volume.
#
# Production runs here for local measurements and in CI, so its three
# databases sit in storage/ like the others (ignored by git).
production:
  primary:
    <<: *default
    database: storage/production.sqlite3
  cache:
    <<: *default
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
