# The site's own settings. The header and footer are not here: they are the
# site's parts, made of blocks in the editor and published as pages are
# (SiteParts), and a site that has not published its own draws the
# starters of config/parts.
#
# The time zone is the CMS's own setting: the editor shows it and never
# changes it.
shared:
  # The site's time zone, an IANA name. The editor shows and takes the
  # time of a scheduled publish in it, the same for every visitor, and
  # config.time_zone is set from it (config/application.rb); the API's
  # times stay ISO 8601 in UTC.
  time_zone: Europe/London
