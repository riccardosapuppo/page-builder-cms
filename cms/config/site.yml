# The parts of the site theme around every page: the site's name in the
# header, the menu, the header's action button and the footer line. The
# design draws them as part of the theme (design/index.html, header and
# footer), not as blocks of a page, and nothing in the editor changes them
# yet, so they live here until it does. The example site is the design's
# own, Slack Water.
#
# Every href goes through RenderPolicy like a link in a page, and the
# menu's anchors point at sections of the home page (/#swims), so they work
# from every page.
shared:
  name: Slack Water
  menu:
    - label: Swims
      href: /#swims
    - label: Gallery
      href: /#gallery
    - label: Meet us
      href: /#meet
    - label: Questions
      href: /#questions
  action:
    label: Join
    href: /#join
  footer:
    lead: Slack Water swimming club.
    text: Tide times are a guide, not a promise.
