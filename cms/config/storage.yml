# Uploaded files stay on this machine's disk: the project uses no cloud
# storage service, and keeps no credentials for one.
test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# The CMS the editor's browser tests start: uploads go to the folder the
# harness makes for the run (CMS_STORAGE_ROOT) and deletes afterwards.
e2e:
  service: Disk
  root: <%= ENV.fetch("CMS_STORAGE_ROOT") { Rails.root.join("tmp/e2e/storage") } %>
