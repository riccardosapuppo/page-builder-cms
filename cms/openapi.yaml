openapi: 3.1.0
info:
  title: Page Builder CMS API
  version: 0.1.0
  summary: The JSON API the page editor saves and publishes through.
  description: |
    Pages, their draft and versions, publishing now or at a set time, the
    responses visitors send with the forms of published pages, the media
    library, the site style, the site's settings, the collections and
    their entries, and the shop's settings and orders of Page Builder CMS.
    The editor talks to the CMS only through this
    API, so another server that answers the same way can stand in for it.
    (Visitors send their forms to the published page's own address, not to
    this API.)

    The page document is not described here: it is the one schema both the
    editor and the server validate with, `schema/block-document.schema.json`,
    and every document below refers to that file.

    **The header and footer** are pages too, the site's parts, of their own
    `kind` (`header`, `footer`; every other page's is `page`): documents
    of that schema, edited, versioned, scheduled and published as a page is,
    which every published page draws around its sections. A part has no
    address and is never the home page, and its draft holds no form, a
    form's answers belonging to a page, and no section anchor, since it is
    drawn in every page beside the page's own sections: 422, keyword
    `part`. Until a part is
    published, the pages draw its starter, the CMS's own, which the part's
    first draft holds.

    **Collections** are types of content (News, Events): each has a name,
    an address prefix its entries live under, its fields and the order its
    entries are listed in, a definition held to
    `schema/collection.schema.json` and to the collection's application
    rules, which also hold each entry's values to the fields. An entry has
    a draft, saved at a revision as a page's is, and what is live: the
    title, slug and values it was last published with. A collection's
    template, the document every entry is drawn with, is a page of kind
    `template`, which belongs to its collection: read, saved, kept,
    scheduled and published by the page routes, by its id, as a part is,
    with no address, never the home page (422 at the member, keyword
    `template`), and no form (422 at the form block, keyword `template`).

    **The shop** sells the entries of one collection, its products, at the
    price of one of its number fields, in one currency, through Stripe's
    Checkout in its test mode alone: its settings, which may be off; and
    the orders its checkout made, each read again of Stripe on demand.
    Visitors put products in a cart and check out at the site's own
    `/cart` addresses, not through this API.

    **Errors** all have one shape, `{"error": <code>, "message": <sentence>}`.
    A 422 adds `errors`, one entry per problem, each with a JSON `pointer`
    into the request body, the `keyword` of the rule it broke and, for a
    value inside a block of the document, the `blockPointer` of that block.
    A request body with a member name repeated in one object is refused with
    422 `duplicate_key`; a body that is not JSON at all, with 400
    `malformed_json`. No string member of a request body may hold the
    character U+0000: 422, keyword `pattern`. A path whose id is not in the
    form its parameter describes is 404. A query parameter an operation
    does not take, one named twice, or a value not in its parameter's form
    is 400 `invalid_query`, naming the `parameter`. A failure the server
    did not foresee is answered 500 `internal_error`, in the same shape,
    never as an HTML page.

    The API has no authentication: the server listens on 127.0.0.1 only.
    Listening there keeps other machines out but not other sites open in a
    browser on the same machine, so every write (POST, PUT, PATCH, DELETE)
    from a browser must come from the CMS's own origin: a write whose
    `Sec-Fetch-Site` is `cross-site` or `same-site`, or whose `Origin` is
    another origin, gets 403 `forbidden_origin`. A client that is not a
    browser sends neither header. And every POST, PUT and PATCH must be
    sent as `application/json`, even with an empty body, or gets 415
    `unsupported_media_type`: a browser cannot send that type to another
    origin without a CORS preflight, which this API never grants.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:3900
    description: The CMS started on this machine.
security: []
tags:
  - name: pages
    description: Pages, their draft, publishing.
  - name: versions
    description: Frozen copies of a page's document.
  - name: responses
    description: What visitors sent with the forms of a page's published versions.
  - name: media
    description: The media library.
  - name: site-style
    description: The palette and type scale of the whole site.
  - name: site
    description: The site's own settings, its time zone.
  - name: collections
    description: Types of content, with their fields and the template their entries are drawn with.
  - name: entries
    description: The entries of a collection, each with a draft and what is live.
  - name: shop
    description: The shop's settings, and whether its checkout is set up.
  - name: orders
    description: The orders the shop's checkout made.

paths:
  /api/pages:
    get:
      operationId: listPages
      summary: List the pages
      tags: [pages]
      responses:
        '200':
          description: |
            Every page, oldest first, and the site's parts, the header then
            the footer. The CMS makes the parts the first time this is asked,
            each with its starter as its draft and nothing live, so both are
            always listed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [pages, parts]
                properties:
                  pages:
                    description: The pages of kind `page`.
                    type: array
                    items:
                      $ref: '#/components/schemas/PageSummary'
                  parts:
                    description: The header, then the footer.
                    type: array
                    minItems: 2
                    maxItems: 2
                    items:
                      $ref: '#/components/schemas/PageSummary'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createPage
      summary: Create a page
      description: A new page with an empty document holding its title. Nothing is live until it is published.
      tags: [pages]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, slug]
              properties:
                title:
                  description: The page title, the document's title.
                  type: string
                slug:
                  $ref: '#/components/schemas/Slug'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/pages/{id}:
    parameters:
      - $ref: '#/components/parameters/PageId'
    get:
      operationId: getPage
      summary: Read a page
      description: The page, its draft with the document, what is live, and its links.
      tags: [pages]
      responses:
        '200':
          description: The page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updatePage
      summary: Set the page's next address, or make it the home page
      description: |
        `slug` takes effect on the next publish; the live address does not
        change before. `home: true` makes this the page the site's root
        address `/` serves, at once, and the page that was home stops being
        it; `home: false` leaves `/` with no page. Until the home page is
        published, `/` answers 404. A header or footer has neither: 422 at
        the member sent, keyword `part`; nor has a template, keyword
        `template`. An address may be a collection's prefix: the page at
        `/news` and the entries at `/news/<slug>` live side by side.
      tags: [pages]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                slug:
                  $ref: '#/components/schemas/Slug'
                home:
                  type: boolean
      responses:
        '200':
          description: The page as it is now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/pages/{id}/draft:
    parameters:
      - $ref: '#/components/parameters/PageId'
    get:
      operationId: getDraft
      summary: Read the draft
      tags: [pages]
      responses:
        '200':
          description: The draft, with its document upgraded to the current schemaVersion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: saveDraft
      summary: Save the draft
      description: |
        Saves the document if the draft is still at `revision`, and raises
        the revision by one. Give each save its own `saveId`, and send the
        same request again when retrying a save whose answer never came: if
        that save was the last one accepted, the retry is answered 200, not
        409. Only an exact retry is: the same `saveId`, the same `revision`
        and the same document (once normalised). The same `saveId` with
        another document or revision is a 409, since nothing it carries was
        stored.

        While someone keeps saving, a version of kind `auto` is kept at most
        every ten minutes.

        The draft of a header or footer holds no form and no section
        anchor: 422 at the form block or the anchor, keyword `part`. A
        template's holds no form: 422 at the form block, keyword
        `template`. Only a template's holds a Field block or an Add to
        cart block, which draw the entry it is drawn with: a page's or a
        part's is refused at the block, keyword `field` or `addToCart`.
      tags: [pages]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, document, saveId]
              properties:
                revision:
                  description: The revision the editor started from.
                  type: integer
                  minimum: 0
                saveId:
                  $ref: '#/components/schemas/SaveId'
                document:
                  $ref: '../schema/block-document.schema.json'
      responses:
        '200':
          description: Saved, or a retry of the last accepted save.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftSaved'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidRequestOrDocument'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/pages/{id}/publish:
    parameters:
      - $ref: '#/components/parameters/PageId'
    post:
      operationId: publishPage
      summary: Publish the draft
      description: |
        Puts live what the draft holds now, as a new version of kind
        `publish`. The draft's next address takes effect, and the previous
        live address redirects to the page from then on. `publishedAt` never
        moves back. With `revision`, the publish happens only if the draft
        is still at that revision.
      tags: [pages]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                revision:
                  description: The draft revision the person publishing has seen.
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Published.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [published, version, links]
                properties:
                  published:
                    $ref: '#/components/schemas/Published'
                  version:
                    $ref: '#/components/schemas/Version'
                  links:
                    $ref: '#/components/schemas/PageLinks'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidRequestOrDocument'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/pages/{id}/schedules:
    parameters:
      - $ref: '#/components/parameters/PageId'
    get:
      operationId: listSchedules
      summary: List the scheduled publishes
      description: The page's publishes set for a time, newest first, the pending one (if any) and what became of the earlier ones.
      tags: [pages]
      responses:
        '200':
          description: Every scheduled publish of the page.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [schedules]
                properties:
                  schedules:
                    type: array
                    items:
                      $ref: '#/components/schemas/Schedule'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: schedulePublish
      summary: Schedule a publish
      description: |
        Keeps the draft at `revision` as a version of kind `scheduled`, and
        publishes that version at `at`: what goes live then is the draft as
        it was now, not as it will be, and edits made in between wait for
        the next publish. The draft's next address applies, as for any
        publish. The job that publishes looks again when the time comes:
        a schedule cancelled or replaced by then does nothing, and so does
        one whose revision, or a later one, a publish has already put live
        (state `superseded`). A pending schedule of the page is replaced by
        this one and answered as `replaced`.

        `revision` is the draft revision the person scheduling has seen:
        409 if the draft has moved past it. 422 at `/at` for a time that is
        not later than now or is more than a year ahead, and at
        `/revision` when that revision is already live.
      tags: [pages]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, at]
              properties:
                revision:
                  description: The draft revision the person scheduling has seen.
                  type: integer
                  minimum: 0
                at:
                  description: When to publish, ISO 8601 in UTC with Z, to the second or the millisecond. The date and the time must exist.
                  type: string
                  pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:[.][0-9]{1,3})?Z$'
      responses:
        '201':
          description: Scheduled.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [schedule, version, replaced]
                properties:
                  schedule:
                    $ref: '#/components/schemas/Schedule'
                  version:
                    description: The `scheduled` version, of what will go live.
                    $ref: '#/components/schemas/Version'
                  replaced:
                    description: The pending schedule this one replaced, now in state `replaced`, or null.
                    anyOf:
                      - $ref: '#/components/schemas/Schedule'
                      - type: 'null'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidRequestOrDocument'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/pages/{id}/schedules/{scheduleId}/cancel:
    parameters:
      - $ref: '#/components/parameters/PageId'
      - $ref: '#/components/parameters/ScheduleId'
    post:
      operationId: cancelSchedule
      summary: Cancel a scheduled publish
      description: |
        Cancels the schedule if it is still pending; nothing goes live at
        its time. 409 `not_pending` when it is no longer pending (already
        published, cancelled, replaced...), with the schedule as it is.
      tags: [pages]
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [schedule]
                properties:
                  schedule:
                    $ref: '#/components/schemas/Schedule'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The schedule is no longer pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotPendingError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/pages/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/PageId'
    get:
      operationId: listVersions
      summary: List the versions
      tags: [versions]
      responses:
        '200':
          description: Every version, newest first, without documents.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [versions]
                properties:
                  versions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Version'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: saveVersion
      summary: Save a version
      description: Keeps the draft as it is now as a version of kind `manual`, under an optional name.
      tags: [versions]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  description: One line of text, at most 80 characters.
                  type: string
                  maxLength: 80
      responses:
        '201':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidRequestOrDocument'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/pages/{id}/versions/{number}:
    parameters:
      - $ref: '#/components/parameters/PageId'
      - $ref: '#/components/parameters/VersionNumber'
    get:
      operationId: getVersion
      summary: Read a version
      tags: [versions]
      responses:
        '200':
          description: The version, with its document upgraded to the current schemaVersion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionWithDocument'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/pages/{id}/versions/{number}/restore:
    parameters:
      - $ref: '#/components/parameters/PageId'
      - $ref: '#/components/parameters/VersionNumber'
    post:
      operationId: restoreVersion
      summary: Restore a version into the draft
      description: |
        First keeps the draft as it is now as a version of kind
        `before-restore`, so no edit is lost, unless the draft is exactly
        the page's newest version. Then copies the version's document,
        upgraded to the current schemaVersion, into the draft, raises the
        draft's revision, and keeps a version of kind `restore`. An editor
        still holding the old revision gets 409 on its next save.
      tags: [versions]
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [draft, version, kept]
                properties:
                  draft:
                    $ref: '#/components/schemas/Draft'
                  version:
                    description: The `restore` version, of the document now in the draft.
                    $ref: '#/components/schemas/Version'
                  kept:
                    description: The `before-restore` version holding the draft as it was, or null when the draft was already the newest version.
                    anyOf:
                      - $ref: '#/components/schemas/Version'
                      - type: 'null'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidDocument'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/pages/{id}/responses:
    parameters:
      - $ref: '#/components/parameters/PageId'
    get:
      operationId: listResponses
      summary: List the responses to the page's forms
      description: |
        What visitors sent with the forms of the page's published versions,
        newest first, at most 50 at a time. Each comes with an excerpt, its
        first text answer that is not empty, so the responses can be told
        apart without reading each. `next` continues the list: ask again
        with `before` set to it. `forms` counts the responses of each form
        of the page that has any, whatever the query says. What a visitor
        wrote is a JSON string, never markup: show it as text.
      tags: [responses]
      parameters:
        - name: form
          in: query
          required: false
          description: Only the responses to this form, by its block's id.
          schema:
            $ref: '#/components/schemas/FormId'
        - name: before
          in: query
          required: false
          description: Only the responses that came before this one, by its id; the `next` of the previous answer.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: A part of the list, and the count of each form's responses.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [responses, next, forms]
                properties:
                  responses:
                    type: array
                    maxItems: 50
                    items:
                      $ref: '#/components/schemas/FormResponseSummary'
                  next:
                    description: The `before` that continues the list; null when nothing older is left.
                    type: [integer, 'null']
                  forms:
                    description: Every form of the page with responses, by its id, each with how many it has; in the order of the ids, character code by character code (the ids are ASCII).
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [formId, count]
                      properties:
                        formId:
                          $ref: '#/components/schemas/FormId'
                        count:
                          type: integer
                          minimum: 1
        '400':
          $ref: '#/components/responses/MalformedJsonOrInvalidQuery'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/pages/{id}/responses/{responseId}:
    parameters:
      - $ref: '#/components/parameters/PageId'
      - $ref: '#/components/parameters/ResponseId'
    get:
      operationId: getResponse
      summary: Read a response
      description: The answers, with the form's fields as the published version they were sent from had them.
      tags: [responses]
      responses:
        '200':
          description: The response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormResponse'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteResponse
      summary: Delete a response
      description: Deletes it for good. The page and its versions are not changed.
      tags: [responses]
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/MalformedJson'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/media/direct_uploads:
    post:
      operationId: startUpload
      summary: Start an image upload
      description: |
        The first step of a direct upload, the same request and answer as
        Active Storage's own endpoint, so `@rails/activestorage` works with
        it unchanged (hence the snake_case names). Then PUT the bytes to
        `direct_upload.url` with `direct_upload.headers`, and create the
        media item with the `signed_id`. Only JPEG, PNG, WebP and GIF, at
        most 10 MB.
      tags: [media]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [blob]
              properties:
                blob:
                  type: object
                  additionalProperties: false
                  required: [filename, byte_size, checksum, content_type]
                  properties:
                    filename:
                      type: string
                      maxLength: 255
                    byte_size:
                      type: integer
                      minimum: 1
                      maximum: 10485760
                    checksum:
                      description: The MD5 of the bytes, base64.
                      type: string
                      maxLength: 255
                    content_type:
                      $ref: '#/components/schemas/ImageType'
      responses:
        '200':
          description: Where to send the bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectUpload'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/media:
    get:
      operationId: listMedia
      summary: List the media library
      tags: [media]
      responses:
        '200':
          description: Every item, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [media]
                properties:
                  media:
                    type: array
                    items:
                      $ref: '#/components/schemas/MediaItem'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createMedia
      summary: Add an uploaded image to the library
      tags: [media]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [signedBlobId, width, height]
              properties:
                signedBlobId:
                  description: The signed_id of a finished direct upload.
                  type: string
                width:
                  type: integer
                  minimum: 1
                  maximum: 10000
                height:
                  type: integer
                  minimum: 1
                  maximum: 10000
                alt:
                  $ref: '#/components/schemas/Alt'
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItem'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/media/{id}:
    parameters:
      - $ref: '#/components/parameters/MediaId'
    patch:
      operationId: setMediaAlt
      summary: Change the proposed alt text
      description: The alt text new images start with. Images already on pages keep their own.
      tags: [media]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [alt]
              properties:
                alt:
                  $ref: '#/components/schemas/Alt'
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItem'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteMedia
      summary: Delete an image
      tags: [media]
      responses:
        '204':
          description: Deleted, with its file.
        '400':
          $ref: '#/components/responses/MalformedJson'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A draft, a kept version or an entry still shows the image; nothing was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaInUseError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/site-style:
    get:
      operationId: getSiteStyle
      summary: Read the site style
      tags: [site-style]
      responses:
        '200':
          description: The style, and the values each part may take.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteStyle'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: setSiteStyle
      summary: Change the site style
      description: The whole style, every palette slot named, each with one of its curated tones or a colour of the site's own. The letter width and the custom CSS when given; without one, the style keeps its own. CSS that does not keep to the site (an unclosed rule, a brace that closes nothing, @import) is refused at /customCss, with its line.
      tags: [site-style]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [palette, typeScale]
              properties:
                palette:
                  $ref: '#/components/schemas/Palette'
                typeScale:
                  type: string
                letterWidth:
                  type: string
                customCss:
                  $ref: '#/components/schemas/CustomCss'
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteStyle'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/site:
    get:
      operationId: getSite
      summary: Read the site's settings
      description: |
        The site's time zone, in which the editor shows and sets scheduled
        publishes. It is the CMS's setting, and no request changes it. The
        header and footer are the site's parts, listed with the pages.
      tags: [site]
      responses:
        '200':
          description: The site's settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/collections:
    get:
      operationId: listCollections
      summary: List the collections
      description: Every collection, oldest first, each with its definition, how many entries it has, and its template.
      tags: [collections]
      responses:
        '200':
          description: The collections.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [collections]
                properties:
                  collections:
                    type: array
                    items:
                      $ref: '#/components/schemas/Collection'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createCollection
      summary: Create a collection
      description: |
        A new collection, from its definition, held to
        `schema/collection.schema.json` and the collection's application
        rules (each fault at its pointer); then its prefix to the CMS's
        own: taken by another collection (keyword `taken`), or an address
        the application answers itself (`reserved`). A page's address,
        next or live, may be a prefix. Its template is made with it: an
        empty document titled with its name, nothing live.
      tags: [collections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schema/collection.schema.json'
      responses:
        '201':
          description: Created, with its template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/collections/{id}:
    parameters:
      - $ref: '#/components/parameters/CollectionId'
    get:
      operationId: getCollection
      summary: Read a collection
      tags: [collections]
      responses:
        '200':
          description: The collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateCollection
      summary: Change a collection's definition
      description: |
        The members given replace the definition's own, and the definition
        is checked whole, as a new one is: a field the sort follows cannot
        go without a new sort (422 at `/sort/by`, keyword `sortField`), nor
        the field the shop's settings name as the price stop being a number
        field of the collection they name (422 at `/fields`, or at that
        field's type, keyword `shopPrice`). A
        change that changes something advances `publishedRevision`. The
        entries' values under a key no field has any more are kept until
        each entry's next save, which must leave them out.
      tags: [collections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name:
                  $ref: '../schema/collection.schema.json#/properties/name'
                prefix:
                  $ref: '../schema/collection.schema.json#/$defs/slug'
                fields:
                  $ref: '../schema/collection.schema.json#/properties/fields'
                sort:
                  $ref: '../schema/collection.schema.json#/$defs/sort'
      responses:
        '200':
          description: The collection as it is now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteCollection
      summary: Delete a collection
      description: With its entries, their old addresses, and its template with the template's draft and versions; not while the shop's settings name it, on or off (409 `collection_in_shop`).
      tags: [collections]
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/MalformedJson'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The shop sells from this collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionInShopError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/collections/{id}/entries:
    parameters:
      - $ref: '#/components/parameters/CollectionId'
    get:
      operationId: listEntries
      summary: List a collection's entries
      description: |
        Every entry of the collection whose title holds `q` (ASCII letters
        compared without their case), in the order `order` names or, without
        it, the collection's `sort`. An entry with no value to order by (one
        not live, by `publishedAt`; one without the field's value) comes
        last either way; entries of one value come in the order they were
        made, or its reverse for a descending order.
      tags: [entries]
      parameters:
        - name: q
          in: query
          required: false
          description: Words to look for in the titles.
          schema:
            type: string
            maxLength: 200
        - name: order
          in: query
          required: false
          description: title, updatedAt, publishedAt, createdAt, or the key of one of the collection's date or number fields; a minus before it for a descending order.
          schema:
            type: string
            pattern: '^-?(?:title|updatedAt|publishedAt|createdAt|[a-z][a-z0-9-]{0,63})$'
      responses:
        '200':
          description: The entries.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/Entry'
        '400':
          $ref: '#/components/responses/MalformedJsonOrInvalidQuery'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createEntry
      summary: Create an entry
      description: |
        A new entry, its title, slug and values held to the collection's
        fields (`schema/collection.schema.json` and the collection's
        application rules: a value under a key no field has is
        `unknownField`, a required field without one `required`, and each
        value refused at `/values/<key>`); an image it names must be in the
        media library (`mediaExists`); its slug must be no other entry's,
        next or live (`taken`). Nothing is live until it is published.
      tags: [entries]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schema/collection.schema.json#/$defs/entry'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/collections/{id}/entries/{entryId}:
    parameters:
      - $ref: '#/components/parameters/CollectionId'
      - $ref: '#/components/parameters/EntryId'
    get:
      operationId: getEntry
      summary: Read an entry
      tags: [entries]
      responses:
        '200':
          description: The entry, its draft and what is live.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: saveEntry
      summary: Save an entry
      description: |
        Saves the title, slug and values if the entry is still at
        `revision`, and raises the revision by one, as a page's draft is
        saved: the same `saveId`, `revision`, title, slug and values sent
        again after the answer was lost is answered 200, and anything else
        from a revision the entry has moved past is a 409. Held to the
        collection's fields as a new entry is. What is live does not
        change until the next publish.
      tags: [entries]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, saveId, title, slug, values]
              properties:
                revision:
                  description: The revision the editor started from.
                  type: integer
                  minimum: 0
                saveId:
                  $ref: '#/components/schemas/SaveId'
                title:
                  $ref: '../schema/collection.schema.json#/$defs/textValue'
                slug:
                  $ref: '../schema/collection.schema.json#/$defs/slug'
                values:
                  $ref: '#/components/schemas/EntryValues'
      responses:
        '200':
          description: Saved, or a retry of the last accepted save.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteEntry
      summary: Delete an entry
      description: With its old addresses. A live entry's delete advances its collection's `publishedRevision`.
      tags: [entries]
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/MalformedJson'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/collections/{id}/entries/{entryId}/publish:
    parameters:
      - $ref: '#/components/parameters/CollectionId'
      - $ref: '#/components/parameters/EntryId'
    post:
      operationId: publishEntry
      summary: Publish an entry
      description: |
        Puts live what the draft holds now: its title, slug and values,
        checked again against the collection's fields as they are (422 at
        the value, as for a save). With `revision`, only if the entry is
        still at it (409 otherwise). The slug becomes its address; the one
        it had redirects to it from then on, and a redirect from the new
        one goes. When it went live is the first publish's time, until an
        unpublish. Advances the collection's `publishedRevision`.
      tags: [entries]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                revision:
                  description: The revision the person publishing has seen.
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/collections/{id}/entries/{entryId}/unpublish:
    parameters:
      - $ref: '#/components/parameters/CollectionId'
      - $ref: '#/components/parameters/EntryId'
    post:
      operationId: unpublishEntry
      summary: Unpublish an entry
      description: Takes it off, its draft kept; an entry not live is answered as it is. Taking a live one off advances the collection's `publishedRevision`.
      tags: [entries]
      responses:
        '200':
          description: The entry, with nothing live.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/shop:
    get:
      operationId: getShop
      summary: Read the shop's settings
      description: |
        The shop's settings (off, in pounds, with no collection, until they
        first change), and whether checkout is set up on this CMS: a key of
        Stripe's test mode where the CMS runs, in `STRIPE_SECRET_KEY`, and
        Stripe's API at `https://api.stripe.com` or a server on 127.0.0.1;
        if not, why not. The key itself is never answered.
      tags: [shop]
      responses:
        '200':
          description: The settings, and whether checkout is set up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shop'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: setShop
      summary: Change the shop's settings
      description: |
        Every member, checked whole against the collections as they are,
        each fault at its member: a currency not of the list (`enum`); a
        collection the site does not have (`collectionExists`) or one with
        no number field (`numberField`); a price that is no number field of
        that collection, or one named with no collection (`priceField`); a
        shop on without both (`required`). Then, for a shop that is on, the
        cart's address, `/cart`, which nothing may hold, each fault at
        `/enabled` naming what holds it and how to free it: a page at
        `/cart` or to be published there (`cartAddress`), a collection
        whose prefix is `cart` (`cartPrefix`). Only a site that held `cart`
        before the shop reserved it can: the shop is not turned on over
        it. The collection and the price field the settings name then stay
        as they are while named: the collection is not deleted (409
        `collection_in_shop`), and its price field neither goes nor changes
        its type (422, `shopPrice`).
      tags: [shop]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopSettings'
      responses:
        '200':
          description: The settings as they are now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shop'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/orders:
    get:
      operationId: listOrders
      summary: List the orders
      description: Every order the shop's checkout made, the newest first. An order holds the email its buyer gave Stripe, so no answer here is kept by a cache (`no-store`).
      tags: [orders]
      responses:
        '200':
          description: The orders.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [orders]
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      operationId: getOrder
      summary: Read an order
      tags: [orders]
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/orders/{id}/refresh:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      operationId: refreshOrder
      summary: Ask Stripe again about an order
      description: |
        An open order's Checkout Session, asked of Stripe again, and the
        order kept as Stripe says it is: paid (with the email Stripe gives,
        and when the CMS learned it), expired, or still open; for a visitor
        who never came back to the thanks page. An order that is not open is
        answered as it is, and Stripe is not asked. 409
        `checkout_not_set_up` when an open order cannot be asked about, the
        reason in the message; 502 `stripe_failed` when Stripe could not be
        reached or refused, nothing changed.
      tags: [orders]
      responses:
        '200':
          description: The order as it is now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Checkout is not set up on this CMS, so an open order cannot be asked about.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutNotSetUpError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          description: Stripe could not be reached, or refused; the order is as it was.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StripeFailedError'

components:
  parameters:
    PageId:
      name: id
      in: path
      required: true
      description: The page's id.
      schema:
        type: integer
        minimum: 1
    VersionNumber:
      name: number
      in: path
      required: true
      description: The version's number within its page.
      schema:
        type: integer
        minimum: 1
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      description: The scheduled publish's id.
      schema:
        type: integer
        minimum: 1
    MediaId:
      name: id
      in: path
      required: true
      description: The media item's id, the one documents name as mediaId.
      schema:
        $ref: '#/components/schemas/MediaId'
    ResponseId:
      name: responseId
      in: path
      required: true
      description: The response's id, among the page's responses.
      schema:
        type: integer
        minimum: 1
    CollectionId:
      name: id
      in: path
      required: true
      description: The collection's id.
      schema:
        type: integer
        minimum: 1
    EntryId:
      name: entryId
      in: path
      required: true
      description: The entry's id, among the collection's entries.
      schema:
        type: integer
        minimum: 1
    OrderId:
      name: id
      in: path
      required: true
      description: The order's id.
      schema:
        type: integer
        minimum: 1

  responses:
    MalformedJson:
      description: The request cannot be read. Its body is not JSON, or the body or the query is not UTF-8; any request can get this answer.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MalformedJsonError'
    MalformedJsonOrInvalidQuery:
      description: The request cannot be read (see MalformedJson), or its query names a parameter the operation does not take, names one twice, or gives a value not in its parameter's form.
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/MalformedJsonError'
              - $ref: '#/components/schemas/InvalidQueryError'
    NotFound:
      description: No such page, version, media item, response, collection, entry or order.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundError'
    Conflict:
      description: The draft, or the entry, has moved past the revision sent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConflictError'
    InvalidRequest:
      description: The body is not what the request takes, or names a member twice.
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/InvalidRequestError'
              - $ref: '#/components/schemas/DuplicateKeyError'
    InvalidDocument:
      description: The document is not valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvalidDocumentError'
    InvalidRequestOrDocument:
      description: The body is not what the request takes, names a member twice, or holds a document that is not valid.
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/InvalidRequestError'
              - $ref: '#/components/schemas/DuplicateKeyError'
              - $ref: '#/components/schemas/InvalidDocumentError'
    Forbidden:
      description: A browser sent this write from another site or another origin.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenOriginError'
    UnsupportedMediaType:
      description: The request was not sent as application/json.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnsupportedMediaTypeError'
    InternalError:
      description: The server failed in a way it did not foresee. The failure is in the server's log; the answer says nothing about it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalErrorError'

  schemas:
    Slug:
      description: An address, /<slug>. Lowercase letters and digits in words joined by single hyphens, at most 64 characters. Names the application answers itself (api, up, assets, rails, preview, cart, and any file in public/ such as 404) are refused.
      type: string
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      maxLength: 64
    SaveId:
      description: The id the editor gives a save.
      type: string
      pattern: '^[A-Za-z0-9_-]{1,64}$'
    MediaId:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,64}$'
    Alt:
      description: Empty, or one line of text with a visible character, at most 300 characters.
      type: string
      maxLength: 300
    ImageType:
      type: string
      enum: [image/jpeg, image/png, image/webp, image/gif]
    Time:
      description: ISO 8601, UTC.
      type: string
    Document:
      $ref: '../schema/block-document.schema.json'

    PageSummary:
      type: object
      additionalProperties: false
      required: [id, kind, title, slug, home, revision, updatedAt, published, scheduled, links]
      properties:
        id:
          type: integer
        kind:
          $ref: '#/components/schemas/Kind'
        title:
          type: string
        slug:
          $ref: '#/components/schemas/NextAddress'
        home:
          $ref: '#/components/schemas/Home'
        revision:
          type: integer
        updatedAt:
          $ref: '#/components/schemas/Time'
        published:
          $ref: '#/components/schemas/PublishedOrNone'
        scheduled:
          $ref: '#/components/schemas/ScheduleOrNone'
        links:
          $ref: '#/components/schemas/PageLinks'
    Page:
      type: object
      additionalProperties: false
      required: [page, draft, published, scheduled, links]
      properties:
        page:
          type: object
          additionalProperties: false
          required: [id, kind, title, slug, home, createdAt]
          properties:
            id:
              type: integer
            kind:
              $ref: '#/components/schemas/Kind'
            title:
              type: string
            slug:
              $ref: '#/components/schemas/NextAddress'
            home:
              $ref: '#/components/schemas/Home'
            createdAt:
              $ref: '#/components/schemas/Time'
        draft:
          $ref: '#/components/schemas/Draft'
        published:
          $ref: '#/components/schemas/PublishedOrNone'
        scheduled:
          $ref: '#/components/schemas/ScheduleOrNone'
        links:
          $ref: '#/components/schemas/PageLinks'
    Kind:
      description: A page, or one of the site's parts, the header and the footer, which every published page draws around its sections, or a collection's template, which draws each of its entries.
      type: string
      enum: [page, header, footer, template]
    NextAddress:
      description: The next address, the one the next publish applies; null for a header, a footer or a template, which has none.
      type: [string, 'null']
    PublishedOrNone:
      description: What is live, or null before the first publish.
      anyOf:
        - $ref: '#/components/schemas/Published'
        - type: 'null'
    Published:
      description: What is live. A publish always answers with it.
      type: object
      additionalProperties: false
      required: [slug, versionNumber, draftRevision, publishedAt]
      properties:
        slug:
          description: The live address; null for a header or footer, which has none.
          type: [string, 'null']
        versionNumber:
          type: integer
        draftRevision:
          description: The draft's revision the live version was taken from. While the draft's own revision is past it, the draft holds that many saves visitors do not see yet (a save holds every edit made since the one before; one that undoes an earlier save counts too). Equal to it, the draft is what is live. A change of the next address alone (PATCH slug) is no save; compare the page's slug with this object's.
          type: integer
          minimum: 0
        publishedAt:
          $ref: '#/components/schemas/Time'
    ScheduleOrNone:
      description: The publish set for a time and still pending, or null when none is.
      anyOf:
        - $ref: '#/components/schemas/Schedule'
        - type: 'null'
    Schedule:
      description: A publish set for a time.
      type: object
      additionalProperties: false
      required: [id, at, revision, versionNumber, state, createdAt, settledAt, publishedVersionNumber]
      properties:
        id:
          type: integer
        at:
          description: When it goes live.
          $ref: '#/components/schemas/Time'
        revision:
          description: The draft revision that goes live, kept as the version `versionNumber`.
          type: integer
          minimum: 0
        versionNumber:
          description: The `scheduled` version holding what goes live.
          type: integer
        state:
          description: pending until its time; then published, or superseded when a publish had already put this revision or a later one live, or failed. Before its time, cancelled, or replaced by a newer schedule of the page.
          type: string
          enum: [pending, published, cancelled, replaced, superseded, failed]
        createdAt:
          $ref: '#/components/schemas/Time'
        settledAt:
          description: When it stopped being pending; null while it is.
          type: [string, 'null']
        publishedVersionNumber:
          description: For a published one, the `publish` version it made; otherwise null.
          type: [integer, 'null']
    Home:
      description: Whether this is the page the site's root address, `/`, serves. At most one page is.
      type: boolean
    PageLinks:
      type: object
      additionalProperties: false
      required: [self, draft, versions, publish, schedules, preview, live]
      properties:
        self:
          type: string
        draft:
          type: string
        versions:
          type: string
        publish:
          type: string
        schedules:
          type: string
        preview:
          description: The draft as the published page would look, inside the drafts of the header and footer; for a header or footer, the home page's draft inside them.
          type: string
        live:
          description: The live page, `/` for the home page, or null before the first publish, and for a header, a footer or a template, which has no page of its own.
          type: [string, 'null']
    DraftSaved:
      type: object
      additionalProperties: false
      required: [revision, lastSaveId, updatedAt]
      properties:
        revision:
          type: integer
        lastSaveId:
          type: [string, 'null']
        updatedAt:
          $ref: '#/components/schemas/Time'
    Draft:
      type: object
      additionalProperties: false
      required: [revision, lastSaveId, updatedAt, document]
      properties:
        revision:
          type: integer
        lastSaveId:
          type: [string, 'null']
        updatedAt:
          $ref: '#/components/schemas/Time'
        document:
          $ref: '#/components/schemas/Document'
    Version:
      type: object
      additionalProperties: false
      required: [number, reason, name, restoredFrom, createdAt, published]
      properties:
        number:
          type: integer
        reason:
          description: publish, restore, before-restore (the draft a restore replaced), manual ("Save version"), auto (kept while someone edits) or scheduled (the draft as it was when a publish was set for a time, which that publish puts live).
          type: string
          enum: [publish, restore, before-restore, manual, auto, scheduled]
        name:
          type: [string, 'null']
        restoredFrom:
          description: For a restore, the number of the version copied back.
          type: [integer, 'null']
        createdAt:
          $ref: '#/components/schemas/Time'
        published:
          description: Whether this is the version that is live.
          type: boolean
    VersionWithDocument:
      type: object
      additionalProperties: false
      required: [number, reason, name, restoredFrom, createdAt, published, document]
      properties:
        number:
          type: integer
        reason:
          type: string
          enum: [publish, restore, before-restore, manual, auto, scheduled]
        name:
          type: [string, 'null']
        restoredFrom:
          type: [integer, 'null']
        createdAt:
          $ref: '#/components/schemas/Time'
        published:
          type: boolean
        document:
          $ref: '#/components/schemas/Document'
    DirectUpload:
      type: object
      additionalProperties: false
      required: [signed_id, filename, content_type, byte_size, checksum, direct_upload]
      properties:
        signed_id:
          type: string
        filename:
          type: string
        content_type:
          $ref: '#/components/schemas/ImageType'
        byte_size:
          type: integer
        checksum:
          type: string
        direct_upload:
          type: object
          additionalProperties: false
          required: [url, headers]
          properties:
            url:
              description: Where to PUT the bytes.
              type: string
            headers:
              description: The headers to send with them.
              type: object
              additionalProperties:
                type: string
    MediaItem:
      type: object
      additionalProperties: false
      required: [id, alt, width, height, contentType, byteSize, filename, url, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/MediaId'
        alt:
          $ref: '#/components/schemas/Alt'
        width:
          type: integer
        height:
          type: integer
        contentType:
          $ref: '#/components/schemas/ImageType'
        byteSize:
          type: integer
        filename:
          type: string
        url:
          description: Where the image is served, a path on this site and the same address the published page gives it. It answers with the bytes themselves, not a redirect, and may be cached for good, since the bytes behind it never change.
          type: string
        createdAt:
          $ref: '#/components/schemas/Time'
    Palette:
      description: For every palette slot, one of its curated tones, by colour name of schema/tokens.json, or a colour of the site's own written #rrggbb in lower case (the schema's freeColor).
      type: object
      additionalProperties:
        type: string
    CustomCss:
      description: The site's own stylesheet, drawn inside the site on every page after the theme's (in an @scope rule whose root is the page root, linked as /custom.css). Empty for none.
      type: string
      maxLength: 50000
    SiteStyle:
      type: object
      additionalProperties: false
      required: [palette, typeScale, letterWidth, customCss, updatedAt, choices]
      properties:
        palette:
          $ref: '#/components/schemas/Palette'
        typeScale:
          type: string
        letterWidth:
          description: How wide the Headings typeface is drawn.
          type: string
        customCss:
          $ref: '#/components/schemas/CustomCss'
        updatedAt:
          description: Null until the style is first changed.
          type: [string, 'null']
        choices:
          description: The values each part of the style may take, from schema/tokens.json.
          type: object
          additionalProperties: false
          required: [palette, typeScales, letterWidths]
          properties:
            palette:
              type: object
              additionalProperties:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [color, label, hex]
                  properties:
                    color:
                      type: string
                    label:
                      type: string
                    hex:
                      type: string
                      pattern: '^#[0-9A-Fa-f]{6}$'
            typeScales:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [name, label]
                properties:
                  name:
                    type: string
                  label:
                    type: string
            letterWidths:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [name, label]
                properties:
                  name:
                    type: string
                  label:
                    type: string

    Site:
      type: object
      additionalProperties: false
      required: [timeZone]
      properties:
        timeZone:
          description: The site's time zone, an IANA name such as Europe/London. The editor shows and takes the time of a scheduled publish in it; the API's times stay in UTC.
          type: string

    Collection:
      description: A type of content, its entries each drawn with its template.
      type: object
      additionalProperties: false
      required: [id, name, prefix, fields, sort, publishedRevision, entryCount, publishedCount, createdAt, updatedAt, template]
      properties:
        id:
          type: integer
        name:
          type: string
        prefix:
          description: The first part of every entry's address, /<prefix>/<entry slug>.
          type: string
        fields:
          description: The fields every entry has, beside its title and slug, in the order the editor shows them.
          type: array
          items:
            $ref: '../schema/collection.schema.json#/$defs/field'
        sort:
          $ref: '../schema/collection.schema.json#/$defs/sort'
        publishedRevision:
          description: Advanced by every change a visitor could see of the collection's entries (a publish, an unpublish, the delete of a live entry) and of its definition; the pages that list its entries are cached by it.
          type: integer
          minimum: 0
        entryCount:
          type: integer
          minimum: 0
        publishedCount:
          description: How many of its entries are live.
          type: integer
          minimum: 0
        createdAt:
          $ref: '#/components/schemas/Time'
        updatedAt:
          description: When its definition last changed.
          $ref: '#/components/schemas/Time'
        template:
          description: The page of kind template that draws each entry, read, saved, kept and published by the page routes, by its id.
          $ref: '#/components/schemas/PageSummary'
    EntryValues:
      description: The values of the collection's fields, by key, each held to its field by the collection's rules. A value under a key no field has any more is kept from before until the entry's next save, which must leave it out.
      type: object
      additionalProperties:
        $ref: '#/components/schemas/EntryValue'
    EntryValue:
      description: A value of one of the types of field, whichever its field is; which one its field takes is the collection's rules' to say.
      anyOf:
        - $ref: '../schema/collection.schema.json#/$defs/textValue'
        - $ref: '../schema/collection.schema.json#/$defs/paragraphValue'
        - $ref: '../schema/collection.schema.json#/$defs/richTextValue'
        - $ref: '../schema/collection.schema.json#/$defs/numberValue'
        - $ref: '../schema/collection.schema.json#/$defs/dateValue'
        - $ref: '../schema/collection.schema.json#/$defs/imageValue'
        - $ref: '../schema/collection.schema.json#/$defs/linkValue'
        - $ref: '../schema/collection.schema.json#/$defs/toggleValue'
        - $ref: '../schema/collection.schema.json#/$defs/choiceValue'
    Entry:
      description: An entry of a collection, its draft and what is live.
      type: object
      additionalProperties: false
      required: [id, collectionId, title, slug, values, revision, lastSaveId, createdAt, updatedAt, published]
      properties:
        id:
          type: integer
        collectionId:
          type: integer
        title:
          type: string
        slug:
          description: The next address, /<prefix>/<slug>, which the next publish applies.
          type: string
        values:
          $ref: '#/components/schemas/EntryValues'
        revision:
          type: integer
        lastSaveId:
          description: The saveId of the save that brought the entry to its revision; null before any save.
          type: [string, 'null']
        createdAt:
          $ref: '#/components/schemas/Time'
        updatedAt:
          description: The latest save, publish or unpublish.
          $ref: '#/components/schemas/Time'
        published:
          description: What is live, or null before the first publish and after an unpublish.
          anyOf:
            - $ref: '#/components/schemas/EntryPublished'
            - type: 'null'
    EntryPublished:
      description: What is live of an entry.
      type: object
      additionalProperties: false
      required: [title, slug, values, draftRevision, publishedAt]
      properties:
        title:
          type: string
        slug:
          description: The live address, /<prefix>/<slug>.
          type: string
        values:
          $ref: '#/components/schemas/EntryValues'
        draftRevision:
          description: The entry's revision what is live was taken from; while the entry's own revision is past it, it holds that many saves visitors do not see yet.
          type: integer
          minimum: 0
        publishedAt:
          description: When it went live, the first publish since the last unpublish.
          $ref: '#/components/schemas/Time'

    Currency:
      description: The currency a shop sells in, a closed list.
      type: string
      enum: [GBP, EUR, USD]
    ShopSettings:
      description: The shop's settings, as a change of them sends them.
      type: object
      additionalProperties: false
      required: [enabled, currency, productsCollectionId, priceField]
      properties:
        enabled:
          description: Whether the shop sells. Off, no cart answers at `/cart` and below it, which are the site's pages' and entries' addresses again, the 404 page unless a page or a collection held `cart` before the shop reserved it.
          type: boolean
        currency:
          $ref: '#/components/schemas/Currency'
        productsCollectionId:
          description: The collection whose entries are the products, a collection with a number field; null for none, which a shop that is on cannot be.
          type: [integer, 'null']
          minimum: 1
        priceField:
          description: The key of the products collection's number field that is each product's price, in the currency's main unit; null for none, which a shop that is on cannot be.
          type: [string, 'null']
    Shop:
      description: The shop's settings, when they last changed, and whether checkout is set up on this CMS.
      type: object
      additionalProperties: false
      required: [enabled, currency, productsCollectionId, priceField, updatedAt, checkout]
      properties:
        enabled:
          type: boolean
        currency:
          $ref: '#/components/schemas/Currency'
        productsCollectionId:
          type: [integer, 'null']
        priceField:
          type: [string, 'null']
        updatedAt:
          description: Null until the settings first change.
          type: [string, 'null']
        checkout:
          description: Whether a checkout reaches Stripe, in its test mode, and if not, why not, in words the editor shows; the key is never given.
          type: object
          additionalProperties: false
          required: [ready, reason]
          properties:
            ready:
              type: boolean
            reason:
              description: Null when ready.
              type: [string, 'null']
    OrderLine:
      description: A line of an order, as the product was sold.
      type: object
      additionalProperties: false
      required: [entryId, title, unitAmount, quantity]
      properties:
        entryId:
          description: The id the product's entry had; it may be gone since.
          type: integer
          minimum: 1
        title:
          description: The product's title then.
          type: string
        unitAmount:
          description: Its price then, in the currency's smallest unit (pence, cents).
          type: integer
          minimum: 0
        quantity:
          type: integer
          minimum: 1
          maximum: 20
    Order:
      description: What a visitor's checkout asked Stripe to be paid.
      type: object
      additionalProperties: false
      required: [id, status, currency, lines, total, stripeSessionId, email, paidAt, createdAt, updatedAt]
      properties:
        id:
          type: integer
        status:
          description: open from the checkout until Stripe says the order is paid, or that its session expired unpaid.
          type: string
          enum: [open, paid, expired]
        currency:
          $ref: '#/components/schemas/Currency'
        lines:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/OrderLine'
        total:
          description: What the lines cost together, in the currency's smallest unit.
          type: integer
          minimum: 0
        stripeSessionId:
          description: The id of the order's Checkout Session at Stripe (cs_test_...); null only while the checkout asks Stripe for it.
          type: [string, 'null']
        email:
          description: The email the buyer gave Stripe, once paid; null until then.
          type: [string, 'null']
        paidAt:
          description: When the CMS learned from Stripe that the order is paid; null until then.
          type: [string, 'null']
        createdAt:
          $ref: '#/components/schemas/Time'
        updatedAt:
          $ref: '#/components/schemas/Time'

    FormId:
      description: A form block's id in the page's document (blockId in the document's schema).
      type: string
      pattern: '^[A-Za-z0-9_-]{1,64}$'
    KeptField:
      description: A field of the form, as the published version the response came from had it (formField in the document's schema). maxLength only for the two kinds of text.
      type: object
      additionalProperties: false
      required: [name, kind, label, required]
      properties:
        name:
          description: The key its answer is kept under in `answers`.
          type: string
          pattern: '^[a-z][a-z0-9-]{0,39}$'
        kind:
          type: string
          enum: [text, email, textarea, checkbox]
        label:
          type: string
        required:
          type: boolean
        maxLength:
          type: integer
          minimum: 1
          maximum: 5000
    ResponseExcerpt:
      description: The response's first text answer that is not empty, on one line (each run of white space made one space), at most 120 characters as a reader counts them.
      type: object
      additionalProperties: false
      required: [label, text, truncated]
      properties:
        label:
          description: The label of the answer's field.
          type: string
        text:
          type: string
          minLength: 1
        truncated:
          description: Whether the answer was longer and has been cut.
          type: boolean
    FormResponseSummary:
      type: object
      additionalProperties: false
      required: [id, formId, versionNumber, submittedAt, excerpt]
      properties:
        id:
          type: integer
        formId:
          $ref: '#/components/schemas/FormId'
        versionNumber:
          description: The published version the form was read from.
          type: integer
        submittedAt:
          $ref: '#/components/schemas/Time'
        excerpt:
          description: Null when every text answer is empty, or the form has only checkboxes.
          anyOf:
            - $ref: '#/components/schemas/ResponseExcerpt'
            - type: 'null'
    FormResponse:
      type: object
      additionalProperties: false
      required: [id, formId, versionNumber, submittedAt, fields, answers]
      properties:
        id:
          type: integer
        formId:
          $ref: '#/components/schemas/FormId'
        versionNumber:
          description: The published version the form was read from.
          type: integer
        submittedAt:
          $ref: '#/components/schemas/Time'
        fields:
          description: The form's fields, in order, as that version had them.
          type: array
          items:
            $ref: '#/components/schemas/KeptField'
        answers:
          description: Each field's answer, by its name; every field has one. A text is the string sent ("" when left empty), never markup; a checkbox's answer is whether it was ticked.
          type: object
          propertyNames:
            pattern: '^[a-z][a-z0-9-]{0,39}$'
          additionalProperties:
            type: [string, boolean]

    ErrorDetail:
      type: object
      additionalProperties: false
      required: [pointer, keyword, blockPointer, message]
      properties:
        pointer:
          description: A JSON pointer into the request body ("" is the body itself).
          type: string
        keyword:
          description: The rule that failed, as JSON Schema names it (required, type, pattern, maximum...) or as the application rules do (uniqueId, uniqueAnchor, duplicateKey, finite, mediaExists...).
          type: string
        blockPointer:
          description: For a value inside a block of the document, the pointer of that block; otherwise null.
          type: [string, 'null']
        message:
          type: string
    MalformedJsonError:
      type: object
      additionalProperties: false
      required: [error, message]
