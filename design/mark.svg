<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <title>Page Builder CMS</title>
  <!-- Direction A's own drawing: two corner brackets marking out a block, in
       Graphite, on the 16 px grid. A 1 px white keyline (the same keyline the
       selection carries on the canvas) keeps them readable on dark tabs.
       The accent is only the 2 px dot in the middle. -->
  <path d="M3 10V3h7M13 6v7H6" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="butt" stroke-linejoin="miter"/>
  <path d="M3 9V3h6M13 7v6H7" fill="none" stroke="#1B1F24" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"/>
  <rect x="7" y="7" width="2" height="2" fill="#EDC200"/>
</svg>
