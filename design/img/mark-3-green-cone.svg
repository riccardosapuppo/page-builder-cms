<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <title>The third mark: the green cone, a starboard-hand buoy across the channel</title>
  <!-- The course's four marks share one waterline (y 500); the water deepens from the first to the fourth. -->
  <rect width="800" height="800" fill="#DCEBEA"/>
  <rect y="500" width="800" height="300" fill="#1D4A58"/>
  <g fill="#3D6F7C">
    <rect x="80" y="580" width="200" height="7" rx="3.5"/>
    <rect x="520" y="550" width="230" height="7" rx="3.5"/>
    <rect x="300" y="704" width="280" height="8" rx="4"/>
  </g>
  <!-- The topmark: a green cone, point up, on its mast -->
  <rect x="395" y="204" width="10" height="90" fill="#0E2A35"/>
  <path d="M400 140 L440 210 H360 Z" fill="#1F7A55"/>
  <!-- The cone on its float -->
  <path d="M318 512 L372 286 H428 L482 512 Z" fill="#1F7A55"/>
  <path d="M341 416 H459 L465 440 H335 Z" fill="#FFFFFF" opacity=".9"/>
  <path d="M282 492 H518 L500 536 H300 Z" fill="#0E2A35"/>
  <g opacity=".6" fill="#1F7A55">
    <rect x="330" y="552" width="140" height="8" rx="4"/>
    <rect x="352" y="572" width="96" height="7" rx="3.5"/>
    <rect x="376" y="590" width="48" height="6" rx="3"/>
  </g>
</svg>
