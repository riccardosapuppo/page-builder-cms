<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700">
  <title>The mouth of the bay at first light: the red and white safe-water mark, and the club's line of orange buoys behind it</title>
  <!-- The bay before the sun: deep water owns it; the sky pales towards one line of first light. -->
  <rect width="1600" height="700" fill="#0E2A35"/>
  <rect y="150" width="1600" height="70" fill="#123441"/>
  <rect y="220" width="1600" height="56" fill="#183D4A"/>
  <rect y="276" width="1600" height="34" fill="#25515F"/>
  <rect y="310" width="1600" height="22" fill="#3D6F7C"/>
  <rect y="332" width="1600" height="9" fill="#DCEBEA"/>
  <circle cx="1012" cy="336" r="7" fill="#F6D55C"/>
  <!-- The headland -->
  <path d="M1040 341 C1150 300 1240 276 1330 268 C1420 260 1500 252 1600 246 V341 Z" fill="#0A222B"/>
  <!-- The bay -->
  <rect y="341" width="1600" height="359" fill="#123744"/>
  <g fill="#DCEBEA" opacity=".55">
    <rect x="930" y="354" width="150" height="3" rx="1.5"/>
    <rect x="980" y="366" width="80" height="3" rx="1.5"/>
    <rect x="890" y="379" width="210" height="3" rx="1.5"/>
  </g>
  <g fill="#25515F">
    <rect x="60" y="430" width="200" height="5" rx="2.5"/>
    <rect x="640" y="470" width="160" height="5" rx="2.5"/>
    <rect x="120" y="640" width="300" height="6" rx="3"/>
    <rect x="1180" y="570" width="300" height="6" rx="3"/>
    <rect x="860" y="650" width="260" height="6" rx="3"/>
  </g>
  <!-- The buoy line, receding to the headland, its rope on the water -->
  <path d="M640 566 C800 532 960 492 1120 460 C1240 438 1320 424 1400 414" fill="none" stroke="#DCEBEA" stroke-width="3" opacity=".45"/>
  <g>
    <rect x="1385" y="394" width="22" height="24" rx="11" fill="#F2A541"/>
    <rect x="1254" y="392" width="34" height="38" rx="17" fill="#F2A541"/>
    <rect x="1254" y="419" width="34" height="7" fill="#D9822A"/>
    <rect x="1084" y="400" width="54" height="64" rx="27" fill="#F2A541"/>
    <rect x="1084" y="446" width="54" height="12" fill="#D9822A"/>
    <rect x="1084" y="424" width="54" height="7" fill="#FFFFFF" opacity=".85"/>
    <rect x="850" y="410" width="88" height="108" rx="44" fill="#F2A541"/>
    <rect x="850" y="488" width="88" height="19" fill="#D9822A"/>
    <rect x="850" y="454" width="88" height="10" fill="#FFFFFF" opacity=".85"/>
  </g>
  <g fill="#F2A541" opacity=".5">
    <rect x="856" y="526" width="76" height="5" rx="2.5"/>
    <rect x="868" y="538" width="52" height="4" rx="2"/>
    <rect x="1090" y="470" width="42" height="4" rx="2"/>
  </g>
  <!-- Two swimmers on the line -->
  <path d="M978 492 a16 12 0 0 1 32 0 z" fill="#F4A0B5"/>
  <path d="M958 500 h-36 M1030 500 h36" stroke="#DCEBEA" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  <path d="M1186 452 a12 9 0 0 1 24 0 z" fill="#FFFFFF"/>
  <path d="M1172 458 h-24 M1224 458 h24" stroke="#DCEBEA" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>
  <!-- The safe-water mark: a pillar in red and white stripes, a red ball above it -->
  <defs>
    <clipPath id="pillar"><path d="M296 572 L346 296 H454 L504 572 Z"/></clipPath>
  </defs>
  <rect x="396" y="156" width="8" height="144" fill="#0A222B"/>
  <circle cx="400" cy="138" r="36" fill="#C2352B"/>
  <g clip-path="url(#pillar)">
    <rect x="280" y="290" width="240" height="290" fill="#FFFFFF"/>
    <rect x="296" y="290" width="36" height="290" fill="#C2352B"/>
    <rect x="368" y="290" width="36" height="290" fill="#C2352B"/>
    <rect x="440" y="290" width="36" height="290" fill="#C2352B"/>
  </g>
  <rect x="336" y="286" width="128" height="14" rx="4" fill="#0A222B"/>
  <path d="M256 566 H544 L522 618 H278 Z" fill="#0A222B"/>
  <!-- Its reflection, broken by the still water's few ripples -->
  <g opacity=".55">
    <rect x="300" y="634" width="40" height="9" rx="4.5" fill="#C2352B"/>
    <rect x="352" y="634" width="30" height="9" rx="4.5" fill="#FFFFFF"/>
    <rect x="394" y="634" width="46" height="9" rx="4.5" fill="#C2352B"/>
    <rect x="452" y="634" width="26" height="9" rx="4.5" fill="#FFFFFF"/>
    <rect x="320" y="654" width="34" height="7" rx="3.5" fill="#FFFFFF"/>
    <rect x="368" y="654" width="44" height="7" rx="3.5" fill="#C2352B"/>
    <rect x="426" y="654" width="28" height="7" rx="3.5" fill="#FFFFFF"/>
    <rect x="352" y="672" width="92" height="6" rx="3" fill="#C2352B"/>
  </g>
</svg>
