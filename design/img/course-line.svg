<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 600" width="2400" height="600">
  <title>The beginners' course on one waterline: from the slipway, the orange float, the red can, the green cone and the orange buoy line, the water deepening at each, a dashed course joining them</title>
  <!-- Each mark stands over the middle of its quarter of the picture, as the four columns below it are laid out. -->
  <defs>
    <!-- The water deepens a step at each mark, as the course goes out: one flat plate per quarter. -->
    <linearGradient id="depth" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#6FA3AB"/>
      <stop offset=".25" stop-color="#6FA3AB"/>
      <stop offset=".25" stop-color="#3D6F7C"/>
      <stop offset=".5" stop-color="#3D6F7C"/>
      <stop offset=".5" stop-color="#1D4A58"/>
      <stop offset=".75" stop-color="#1D4A58"/>
      <stop offset=".75" stop-color="#0E2A35"/>
      <stop offset="1" stop-color="#0E2A35"/>
    </linearGradient>
    <clipPath id="pillar4"><path d="M2050 412 L2070 300 H2130 L2150 412 Z"/></clipPath>
  </defs>
  <rect width="2400" height="600" fill="#DCEBEA"/>
  <rect y="400" width="2400" height="200" fill="url(#depth)"/>
  <!-- The slipway, at the shore -->
  <path d="M0 600 V478 L150 400 H180 L0 520 Z" fill="#C9CFCB"/>
  <path d="M0 500 L160 410 M0 546 L170 420" stroke="#AEB7B3" stroke-width="5"/>
  <g fill="#DCEBEA" opacity=".35">
    <rect x="420" y="470" width="160" height="5" rx="2.5"/>
    <rect x="1020" y="520" width="200" height="5" rx="2.5"/>
    <rect x="1640" y="460" width="180" height="5" rx="2.5"/>
    <rect x="1900" y="550" width="240" height="6" rx="3"/>
  </g>
  <!-- The course, from the slipway out to the buoy line -->
  <path d="M170 430 C500 446 700 440 900 430 S1300 446 1500 432 S1900 444 2100 430" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-dasharray="18 14" opacity=".75"/>

  <!-- 1. The float, with its pennant -->
  <rect x="297" y="300" width="6" height="96" fill="#0E2A35"/>
  <path d="M303 302 L360 320 L303 338 Z" fill="#C2352B"/>
  <circle cx="300" cy="404" r="44" fill="#F2A541"/>
  <rect x="256" y="397" width="88" height="8" fill="#FFFFFF" opacity=".85"/>
  <path d="M256 404 a44 44 0 0 0 88 0 z" fill="#D9822A"/>
  <path d="M256 404 a44 44 0 0 0 88 0 z" fill="#6FA3AB" opacity=".5"/>
  <ellipse cx="300" cy="408" rx="74" ry="9" fill="none" stroke="#DCEBEA" stroke-width="4" opacity=".7"/>

  <!-- 2. The red can -->
  <rect x="896" y="214" width="8" height="70" fill="#0E2A35"/>
  <rect x="876" y="180" width="48" height="44" rx="3" fill="#C2352B"/>
  <rect x="838" y="276" width="124" height="134" rx="6" fill="#C2352B"/>
  <rect x="838" y="312" width="124" height="16" fill="#FFFFFF" opacity=".9"/>
  <rect x="838" y="276" width="124" height="12" rx="6" fill="#A92C24"/>
  <path d="M812 404 H988 L974 438 H826 Z" fill="#0E2A35"/>
  <g fill="#C2352B" opacity=".55">
    <rect x="846" y="452" width="108" height="7" rx="3.5"/>
    <rect x="866" y="470" width="68" height="6" rx="3"/>
  </g>

  <!-- 3. The green cone -->
  <rect x="1496" y="214" width="8" height="70" fill="#0E2A35"/>
  <path d="M1500 164 L1530 218 H1470 Z" fill="#1F7A55"/>
  <path d="M1440 410 L1480 278 H1520 L1560 410 Z" fill="#1F7A55"/>
  <path d="M1457 352 H1543 L1549 372 H1451 Z" fill="#FFFFFF" opacity=".9"/>
  <path d="M1412 404 H1588 L1574 438 H1426 Z" fill="#0E2A35"/>
  <g fill="#1F7A55" opacity=".6">
    <rect x="1446" y="452" width="108" height="7" rx="3.5"/>
    <rect x="1468" y="470" width="64" height="6" rx="3"/>
  </g>

  <!-- 4. The buoy line, and the safe-water mark beyond it -->
  <rect x="2195" y="236" width="4" height="44" fill="#0A222B"/>
  <circle cx="2197" cy="230" r="12" fill="#C2352B"/>
  <path d="M2177 340 L2185 278 H2209 L2217 340 Z" fill="#FFFFFF"/>
  <path d="M2185 278 H2192 L2189 340 H2179 Z M2202 278 H2209 L2214 340 H2205 Z" fill="#C2352B"/>
  <rect x="2240" y="356" width="34" height="52" rx="17" fill="#F2A541"/>
  <rect x="2240" y="392" width="34" height="9" fill="#D9822A"/>
  <rect x="2044" y="300" width="112" height="116" rx="56" fill="#F2A541"/>
  <rect x="2044" y="382" width="112" height="22" fill="#D9822A"/>
  <rect x="2044" y="344" width="112" height="12" fill="#FFFFFF" opacity=".85"/>
  <g fill="#F2A541" opacity=".5">
    <rect x="2056" y="430" width="88" height="7" rx="3.5"/>
    <rect x="2072" y="448" width="56" height="6" rx="3"/>
  </g>
  <!-- A swimmer coming in to the line -->
  <path d="M1888 424 a18 13 0 0 1 36 0 z" fill="#F4A0B5"/>
  <path d="M1872 432 h-34 M1940 432 h34" stroke="#DCEBEA" stroke-width="3" stroke-linecap="round" opacity=".6"/>
</svg>
