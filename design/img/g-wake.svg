<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>A swimmer's wake on still water, an orange cap at its point</title>
  <rect width="800" height="600" fill="#0E2A35"/>
  <g fill="#163B48">
    <rect x="40" y="80" width="220" height="6" rx="3"/>
    <rect x="520" y="60" width="200" height="6" rx="3"/>
    <rect x="600" y="520" width="160" height="6" rx="3"/>
  </g>
  <!-- The wake opens behind the swimmer, towards the foot of the picture -->
  <g fill="none" stroke="#DCEBEA" stroke-linecap="round">
    <path d="M400 210 L160 600" stroke-width="5" opacity=".7"/>
    <path d="M400 210 L640 600" stroke-width="5" opacity=".7"/>
    <path d="M400 240 L250 600" stroke-width="3" opacity=".4"/>
    <path d="M400 240 L550 600" stroke-width="3" opacity=".4"/>
    <path d="M330 330 h140 M300 390 h200 M270 450 h260" stroke-width="3" opacity=".25"/>
  </g>
  <ellipse cx="400" cy="206" rx="44" ry="16" fill="#25515F"/>
  <path d="M370 204 a30 26 0 0 1 60 0 z" fill="#F2A541"/>
  <rect x="370" y="190" width="60" height="6" fill="#0E2A35"/>
  <path d="M336 214 C360 222 380 226 400 226" fill="none" stroke="#DCEBEA" stroke-width="4" stroke-linecap="round" opacity=".7"/>
</svg>
