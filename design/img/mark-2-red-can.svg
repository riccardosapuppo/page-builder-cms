<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <title>The second mark: the red can, a port-hand buoy fifty metres out</title>
  <!-- The course's four marks share one waterline (y 500); the water deepens from the first to the fourth. -->
  <rect width="800" height="800" fill="#DCEBEA"/>
  <rect y="500" width="800" height="300" fill="#2E6270"/>
  <g fill="#4F8A93">
    <rect x="50" y="556" width="220" height="7" rx="3.5"/>
    <rect x="560" y="600" width="190" height="7" rx="3.5"/>
    <rect x="120" y="704" width="260" height="8" rx="4"/>
  </g>
  <!-- The topmark: a small red can on its mast -->
  <rect x="395" y="198" width="10" height="92" fill="#0E2A35"/>
  <rect x="368" y="150" width="64" height="60" rx="4" fill="#C2352B"/>
  <!-- The can on its float -->
  <rect x="318" y="280" width="164" height="232" rx="8" fill="#C2352B"/>
  <rect x="318" y="346" width="164" height="22" fill="#FFFFFF" opacity=".9"/>
  <rect x="318" y="280" width="164" height="16" rx="8" fill="#A92C24"/>
  <path d="M282 492 H518 L500 536 H300 Z" fill="#0E2A35"/>
  <g opacity=".6" fill="#C2352B">
    <rect x="330" y="552" width="140" height="8" rx="4"/>
    <rect x="350" y="572" width="100" height="7" rx="3.5"/>
    <rect x="372" y="590" width="56" height="6" rx="3"/>
  </g>
</svg>
