<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Rock pools at low water, kelp at their edges and a starfish in one</title>
  <rect width="800" height="600" fill="#34434A"/>
  <g fill="#2A383F">
    <path d="M0 0 H800 V90 C640 120 520 70 380 96 C240 122 120 80 0 110 Z"/>
    <path d="M0 600 V500 C160 470 300 540 460 510 C600 484 700 520 800 500 V600 Z"/>
  </g>
  <!-- The pools hold the sky -->
  <path d="M90 230 C110 170 250 150 320 196 C390 242 360 330 270 346 C170 364 70 300 90 230 Z" fill="#9FC4C9"/>
  <path d="M440 300 C470 240 620 220 690 270 C750 314 720 410 620 420 C520 430 410 372 440 300 Z" fill="#8FB6BC"/>
  <path d="M120 446 C150 410 250 404 270 440 C290 476 230 500 180 498 C130 496 100 476 120 446 Z" fill="#9FC4C9"/>
  <g fill="#DCEBEA" opacity=".8">
    <rect x="160" y="214" width="110" height="5" rx="2.5"/>
    <rect x="500" y="290" width="140" height="5" rx="2.5"/>
    <rect x="150" y="452" width="70" height="4" rx="2"/>
  </g>
  <!-- Kelp at the edges -->
  <g fill="none" stroke="#3B5A23" stroke-width="10" stroke-linecap="round">
    <path d="M96 252 C70 270 60 300 76 330"/>
    <path d="M330 220 C356 240 370 270 360 300"/>
    <path d="M700 300 C730 320 740 350 726 380"/>
  </g>
  <!-- A starfish in the second pool -->
  <path d="M600 330 l9 22 24 2 -18 16 6 24 -21 -13 -21 13 6 -24 -18 -16 24 -2 z" fill="#F2A541"/>
</svg>
