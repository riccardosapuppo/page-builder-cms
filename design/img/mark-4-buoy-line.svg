<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <title>The fourth mark: the buoy line, three orange course buoys across the bay, a swimmer at the middle one</title>
  <!-- The course's four marks share one waterline (y 500); the water deepens from the first to the fourth. -->
  <rect width="800" height="800" fill="#DCEBEA"/>
  <rect y="500" width="800" height="300" fill="#0E2A35"/>
  <g fill="#25515F">
    <rect x="300" y="560" width="160" height="6" rx="3"/>
    <rect x="560" y="610" width="200" height="7" rx="3.5"/>
    <rect x="60" y="740" width="300" height="8" rx="4"/>
  </g>
  <path d="M120 660 C300 600 480 556 720 522" fill="none" stroke="#DCEBEA" stroke-width="4" opacity=".5"/>
  <!-- Far, middle, near -->
  <rect x="690" y="472" width="40" height="52" rx="20" fill="#F2A541"/>
  <rect x="690" y="508" width="40" height="9" fill="#D9822A"/>
  <rect x="460" y="444" width="80" height="108" rx="40" fill="#F2A541"/>
  <rect x="460" y="522" width="80" height="18" fill="#D9822A"/>
  <rect x="460" y="488" width="80" height="10" fill="#FFFFFF" opacity=".85"/>
  <rect x="96" y="376" width="148" height="290" rx="74" fill="#F2A541"/>
  <rect x="96" y="600" width="148" height="34" fill="#D9822A"/>
  <rect x="96" y="512" width="148" height="18" fill="#FFFFFF" opacity=".85"/>
  <g fill="#F2A541" opacity=".5">
    <rect x="108" y="682" width="124" height="9" rx="4.5"/>
    <rect x="126" y="704" width="88" height="8" rx="4"/>
    <rect x="470" y="560" width="60" height="6" rx="3"/>
  </g>
  <!-- A swimmer at the middle buoy -->
  <path d="M584 538 a17 12 0 0 1 34 0 z" fill="#F4A0B5"/>
  <path d="M570 546 h-30 M632 546 h30" stroke="#DCEBEA" stroke-width="3" stroke-linecap="round" opacity=".6"/>
</svg>
