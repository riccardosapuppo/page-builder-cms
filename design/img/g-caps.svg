<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Three swim caps, orange, pink and white, at the waterline</title>
  <rect width="800" height="600" fill="#1D4A58"/>
  <g fill="#3D6F7C">
    <rect x="40" y="90" width="180" height="6" rx="3"/>
    <rect x="320" y="70" width="140" height="6" rx="3"/>
    <rect x="560" y="120" width="200" height="6" rx="3"/>
    <rect x="80" y="520" width="220" height="7" rx="3.5"/>
    <rect x="420" y="560" width="300" height="7" rx="3.5"/>
  </g>
  <!-- Three heads in the water: cap, goggle strap, the ring of water round each -->
  <g>
    <ellipse cx="190" cy="352" rx="118" ry="26" fill="#3D6F7C"/>
    <path d="M100 340 a90 82 0 0 1 180 0 z" fill="#F2A541"/>
    <rect x="100" y="314" width="180" height="12" fill="#0E2A35"/>
    <ellipse cx="410" cy="300" rx="118" ry="26" fill="#3D6F7C"/>
    <path d="M320 288 a90 82 0 0 1 180 0 z" fill="#F4A0B5"/>
    <rect x="320" y="262" width="180" height="12" fill="#0E2A35"/>
    <ellipse cx="626" cy="376" rx="118" ry="26" fill="#3D6F7C"/>
    <path d="M536 364 a90 82 0 0 1 180 0 z" fill="#FFFFFF"/>
    <rect x="536" y="338" width="180" height="12" fill="#0E2A35"/>
  </g>
  <g fill="none" stroke="#DCEBEA" stroke-width="4" opacity=".55" stroke-linecap="round">
    <path d="M72 352 h-40 M308 352 h40"/>
    <path d="M292 300 h-40 M528 300 h40"/>
    <path d="M508 376 h-40 M744 376 h40"/>
  </g>
