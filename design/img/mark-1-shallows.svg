<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <title>The first mark: a small orange float with a red pennant, in shallow water off the slipway</title>
  <!-- The course's four marks share one waterline (y 500); the water deepens from the first to the fourth. -->
  <rect width="800" height="800" fill="#DCEBEA"/>
  <rect y="500" width="800" height="300" fill="#5F97A0"/>
  <!-- The slipway, running into the shallows -->
  <path d="M0 800 V640 L330 500 H372 L0 726 Z" fill="#C9CFCB"/>
  <path d="M0 682 L344 510 M0 762 L356 528" stroke="#AEB7B3" stroke-width="6"/>
  <g fill="#8BBDC2">
    <rect x="610" y="548" width="150" height="6" rx="3"/>
    <rect x="420" y="660" width="260" height="7" rx="3.5"/>
    <rect x="300" y="742" width="300" height="8" rx="4"/>
  </g>
  <!-- The float: a pennant on its pole, half in the water, rings around it -->
  <rect x="525" y="328" width="6" height="128" fill="#0E2A35"/>
  <path d="M531 330 L600 352 L531 374 Z" fill="#C2352B"/>
  <circle cx="528" cy="500" r="58" fill="#F2A541"/>
  <rect x="470" y="490" width="116" height="10" fill="#FFFFFF" opacity=".85"/>
  <path d="M470 500 a58 58 0 0 0 116 0 z" fill="#D9822A"/>
  <path d="M470 500 a58 58 0 0 0 116 0 z" fill="#5F97A0" opacity=".45"/>
  <ellipse cx="528" cy="502" rx="96" ry="12" fill="none" stroke="#DCEBEA" stroke-width="4" opacity=".7"/>
  <ellipse cx="528" cy="508" rx="140" ry="20" fill="none" stroke="#DCEBEA" stroke-width="3" opacity=".4"/>
  <path d="M528 560 V780" stroke="#2E6270" stroke-width="5" stroke-dasharray="14 12"/>
</svg>
