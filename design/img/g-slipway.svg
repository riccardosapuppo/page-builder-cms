<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>The slipway running into the water, the red can out in the bay</title>
  <rect width="800" height="600" fill="#DCEBEA"/>
  <rect y="230" width="800" height="370" fill="#2E6270"/>
  <rect y="230" width="800" height="6" fill="#8FB6BC"/>
  <!-- The slipway, from the foot of the picture into the water -->
  <path d="M120 600 L360 236 H470 L560 600 Z" fill="#C9CFCB"/>
  <path d="M360 236 H470 L486 300 H344 Z" fill="#5F97A0" opacity=".55"/>
  <g stroke="#AEB7B3" stroke-width="5">
    <path d="M196 485 H533 M246 409 H514 M290 343 H498 M325 289 H485"/>
  </g>
  <g fill="#4F8A93">
    <rect x="40" y="300" width="200" height="6" rx="3"/>
    <rect x="590" y="330" width="180" height="6" rx="3"/>
    <rect x="600" y="520" width="160" height="7" rx="3.5"/>
  </g>
  <!-- The red can -->
  <rect x="663" y="168" width="4" height="30" fill="#0E2A35"/>
  <rect x="654" y="156" width="22" height="18" rx="2" fill="#C2352B"/>
  <rect x="646" y="194" width="38" height="44" rx="3" fill="#C2352B"/>
  <rect x="640" y="234" width="50" height="9" fill="#0E2A35"/>
</svg>
