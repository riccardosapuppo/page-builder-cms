<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>A flat horizon at first light, the safe-water mark small at its edge</title>
  <rect width="800" height="600" fill="#123441"/>
  <rect y="150" width="800" height="70" fill="#1D4A58"/>
  <rect y="220" width="800" height="50" fill="#3D6F7C"/>
  <rect y="270" width="800" height="28" fill="#8FB6BC"/>
  <rect y="298" width="800" height="8" fill="#F6D55C"/>
  <rect y="306" width="800" height="294" fill="#0E2A35"/>
  <g fill="#F6D55C" opacity=".6">
    <rect x="300" y="322" width="200" height="4" rx="2"/>
    <rect x="350" y="338" width="100" height="4" rx="2"/>
    <rect x="270" y="356" width="260" height="4" rx="2"/>
    <rect x="370" y="374" width="60" height="4" rx="2"/>
  </g>
  <g fill="#25515F">
    <rect x="40" y="430" width="180" height="5" rx="2.5"/>
    <rect x="560" y="470" width="200" height="5" rx="2.5"/>
    <rect x="200" y="540" width="260" height="6" rx="3"/>
  </g>
  <!-- The safe-water mark, far off -->
  <rect x="129" y="262" width="3" height="18" fill="#0A222B"/>
  <circle cx="130" cy="258" r="7" fill="#C2352B"/>
  <path d="M120 306 L124 278 H136 L140 306 Z" fill="#FFFFFF"/>
  <path d="M124 278 H128 L126 306 H121 Z M132 278 H136 L139 306 H133 Z" fill="#C2352B"/>
</svg>
