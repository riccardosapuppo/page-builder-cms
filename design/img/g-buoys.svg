<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>The buoy line across the bay, six orange buoys on one rope</title>
  <rect width="800" height="600" fill="#DCEBEA"/>
  <rect y="250" width="800" height="350" fill="#123744"/>
  <path d="M0 250 H800" stroke="#8FB6BC" stroke-width="6"/>
  <g fill="#25515F">
    <rect x="40" y="300" width="160" height="5" rx="2.5"/>
    <rect x="520" y="290" width="220" height="5" rx="2.5"/>
    <rect x="100" y="560" width="300" height="7" rx="3.5"/>
  </g>
  <path d="M-10 520 C200 430 420 340 810 270" fill="none" stroke="#DCEBEA" stroke-width="4" opacity=".5"/>
  <g fill="#F2A541">
    <rect x="40" y="380" width="96" height="140" rx="48"/>
    <rect x="222" y="352" width="68" height="96" rx="34"/>
    <rect x="370" y="322" width="50" height="70" rx="25"/>
    <rect x="490" y="304" width="38" height="52" rx="19"/>
    <rect x="600" y="290" width="28" height="38" rx="14"/>
    <rect x="700" y="279" width="20" height="28" rx="10"/>
  </g>
  <g fill="#D9822A">
    <rect x="40" y="480" width="96" height="22"/>
    <rect x="222" y="420" width="68" height="15"/>
    <rect x="370" y="372" width="50" height="11"/>
  </g>
  <g fill="#FFFFFF" opacity=".85">
    <rect x="40" y="438" width="96" height="12"/>
    <rect x="222" y="396" width="68" height="8"/>
  </g>
</svg>
