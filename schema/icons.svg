<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    The icons of the icon box widget: one symbol for each name of the
    schema's iconboxBlock enum, with the name as its id. The server draws
    them inline on the published page and the editor reuses this file, so a
    name the schema allows always has a drawing.

    The first eight are the site's own, in the drawing language of the
    design's site icons (sunrise, buoys and cup come from design/index.html):
    a 40-unit grid with a 3-unit margin, strokes with round caps and joins,
    and one shape in class "fill". The forty after them are Lucide's
    (lucide-static 0.460.0, under the ISC licence in LICENSE-Lucide.txt
    beside this file), under their Lucide names and drawn as Lucide draws
    them, on its 24-unit grid; palette's four dots are drawn by their stroke
    alone, which covers them whole as Lucide's fill did. The page sets the
    rest: no fill, the Primary colour as stroke, 2 units of stroke (2.4 px
    on the 40 grid at the 48 px desktop size, 4 px on Lucide's, as Lucide
    draws its icons at that size), and the Accent colour for the "fill"
    shape, which keeps its outline. Nothing else is allowed here: no style,
    no colour, no script, no link; a test holds the file to that.
  -->
  <symbol id="sunrise" viewBox="0 0 40 40"><path class="fill" d="M9 25a11 11 0 0 1 22 0z"/><path d="M4 25h32M8 30h24M13 35h14M20 7v5M8.5 12.5l3 3M31.5 12.5l-3 3"/></symbol>
