# The checks of stage 1 (domain, API and server rendering) and of stage 2
# (the editor, the render contract, accessibility, and npm start), at every
# push to main and on every pull request; on Linux, and on Windows where the
# code takes another path there (npm start and its tools). The later stages
# add tests to these jobs, not jobs: stage 4's caching and scheduled
# publishing run in the Rails tests and in the editor's browser tests, where
# the CMS runs Solid Queue in a forked process. Each job has a time limit: a
# job that hangs is a failure, not a wait.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rails:
    name: Rails tests on Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The lowest Ruby the project supports, and the one it is built on.
        ruby: ["3.3", "3.4"]
    defaults:
      run:
        working-directory: cms
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: cms
      # Two commands, as cms/README.md gives them.
      - run: bin/rails db:test:prepare
      - run: bin/rails test

  schema:
    name: Schema, corpus, contract fixture and API description
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # The Ruby validator runs through the app's bundle.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: cms
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the schema tools
        run: npm ci
        working-directory: schema/tools
      - name: The two validators agree on the corpus
        run: npm run compare
        working-directory: schema/tools
      - name: The corpus is what its generator writes
        run: npm run corpus:check
        working-directory: schema/tools
      - name: Lint the schema, and show the lint failing on planted faults
        run: |
          npm run lint
          npm run lint:plants
        working-directory: schema/tools
      - name: Type-check the schema tools
        run: npm run typecheck
        working-directory: schema/tools
      - name: Install the repository's tools
        run: npm ci
      - name: The 500-block contract fixture is what its generator writes
        run: node tools/gen-contract-500.ts --check
      - name: Lint the API description
        run: npm run lint:openapi

  ruby-lint:
    name: RuboCop, Brakeman and bundler-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cms
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: cms
      - run: bin/rubocop
      - run: bin/brakeman --no-pager
      - run: bin/bundler-audit

  production:
    name: Rails in production, checked over HTTP and in a browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: cms
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      # The readers of netstat, ss and lsof, on samples of each, before the
      # check relies on the one this system takes, and the check failing on
      # a planted fault. Only these: the tools job runs the rest, and here,
      # with the gems installed, the setup's own test would install the
      # editor's packages and seed a database before the check.
      - run: node --test tools/lib/processes.test.ts tools/check-production.test.ts
      # Chromium for the browser half of the check, with the libraries it
      # needs on Ubuntu, at the version the pinned Playwright expects.
      - run: npx playwright install --with-deps chromium
      - run: node tools/check-production.ts

  builder:
    name: Editor checks on Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The lowest Node the editor declares (builder/package.json), and
        # the one it is built on.
        node: ["22.13.0", "24"]
    defaults:
      run:
        working-directory: builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # The unit tests include the fence's planted violations
      # (build/lint-fence.test.ts) and the bundle check's own tests.
      - run: npm test
      # The build fails on eval, Function, require() or a missing font
      # licence in its own output (build/bundle-check.ts).
      - run: npm run build

  builder-e2e:
    name: Editor against a CMS of its own, in a browser
    runs-on: ubuntu-24.04
    # These four steps took 17.0 and then 17.4 minutes on 4 October 2026,
    # on the Windows virtual machine of the README (8 logical processors,
    # 12 GB): the tests against a CMS of their own 48 s, the 192 browser
    # tests 716 s, the 38 accessibility tests again 257 s and the serving
    # checks 23 s in the second run, not counting the install of the gems,
    # the packages and Chromium. A runner of a private repository has two
    # processors and starts each CMS and each browser more slowly, so the
    # limit leaves room for three times that. The first run on GitHub is
    # where the real figure is read, and this comment then says it.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: cms
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
        working-directory: builder
      # Chromium for Playwright, at the version the pinned Playwright expects.
      - run: npx playwright install --with-deps chromium
        working-directory: builder
      # Each starts its own CMS (e2e environment) and, for the browser
      # tests, the editor's development server, on 3901 and 4901.
      - run: npm run test:rails
        working-directory: builder
      - run: npm run e2e
        working-directory: builder
      # The keyboard path, focus after every command, axe on the editor,
      # the published page and every widget, and the shortcut window.
      - run: npm run check:a11y
        working-directory: builder
      # How the editor's page and the published pages are served: on the
      # development server and on vite preview of a build, and by the CMS.
      - run: npm run check:serving
        working-directory: builder

  contract:
    name: Render contract, the server's half and the editor's
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: cms
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # The goldens are what the block partials render now, and the
      # manifest names the renderer's sources as they are.
      - run: bin/rails db:test:prepare
        working-directory: cms
      - run: bin/rails test test/contract/goldens_test.rb
        working-directory: cms
      # The React renderer gives the same trees, and passes the safety check.
      - run: npm ci
        working-directory: builder
      - run: npm run test:contract -- --reporter=verbose
        working-directory: builder

  tools:
    name: Repository tools on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # npm start's parts take different paths on each: netstat and
        # taskkill, ss and process groups, the registry and systemd.
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
      # Ruby for the tests that ask Bundler where it writes the launchers
      # (tools/start/install.test.ts) and that check Ruby's version.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:tools

  start-guard:
    name: npm start refuses Node ${{ matrix.node }} in one sentence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # The editor's own minimum, which the TypeScript tools cannot run
        # on, and an older Node still.
        node: ["22.13.0", "18"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Before any install, as a reader who clones and types npm start
      # meets it: exit 2 and the sentence, never a stack trace.
      - name: The guard says which Node is needed, and nothing starts
        shell: bash
        run: |
          set +e
          npm start > guard.txt 2>&1
          code=$?
          cat guard.txt
          test "$code" -eq 2 || { echo "expected exit 2, got $code"; exit 1; }
          grep -q "and the repository's tools need Node >=24" guard.txt || { echo "the sentence is missing"; exit 1; }
          if grep -q "at .*(.*:[0-9]*:[0-9]*)" guard.txt; then echo "a stack trace was printed"; exit 1; fi

  start-smoke:
    name: npm start in smoke mode on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A first install of the gems on Windows compiles native extensions.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
      # No bundler-cache and no npm ci: npm start installs what it needs by
      # its own routine, as on a reader's machine.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Preflight, install, database, both servers ready, the stop, and
      # what changed outside the repository.
      - run: npm start -- --smoke
      # A real Ctrl+C, and a child that dies, each stopping everything.
      - run: npm run check:start-interrupt
      # The setup migrating an older database leaves the schema it dumps,
      # and git status, as they were: on Windows Ruby wrote it with CRLF.
      # Here, where npm start has installed the gems the test needs; the
      # tools job, which has none, skips it.
      - run: npm run check:setup-tree
