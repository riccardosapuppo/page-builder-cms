<!doctype html>
<!-- The interface is in English and is not to be translated in place:
     the browser would offer to, and a translator that rewrites the text
     React keeps can make the editor fail (translate="no" for every
     browser that honours it, the meta for Chrome's own prompt). -->
<html lang="en" translate="no">
  <head>
    <meta charset="utf-8">
    <meta name="google" content="notranslate">
    <!-- The editor is a tool, the demo an invented club: no page of either
         belongs in a search engine's index, on GitHub Pages (which sets no
         header) or on any host. -->
    <meta name="robots" content="noindex, nofollow">
    <!-- To the phone's edges, the bars keeping clear of its notch and home
         bar (env(safe-area-inset-*), editor.css); the on-screen keyboard
         makes the layout shorter, so the sheets stand above it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <!-- e2e/harness waits for this line to know the page is the editor's. -->
    <meta name="application-name" content="Page Builder CMS">
    <meta name="theme-color" content="#F4F5F7">
    <title>Page Builder CMS</title>
    <!-- The approved design's mark (design/mark.svg), drawn on the 16 px grid it is seen at. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <script>
      // A service worker that another program left on this origin, within
      // this editor's own path, would serve its old files before the
      // network: it is unregistered. Only this path's, since on a shared
      // origin (github.io) the paths above belong to other sites.
      navigator.serviceWorker?.getRegistrations().then((all) => all.filter((worker) => worker.scope.startsWith(new URL("./", location.href).href)).forEach((worker) => worker.unregister()));
    </script>
  </head>
  <body>
    <!-- An underscore, so that no section anchor on the canvas, drawn as
         an id, can take this one. -->
    <div id="editor_root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
